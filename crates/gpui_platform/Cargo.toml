[package]
name = "gpui_platform"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Platform services facade for Longwatch's GPUI desktop shell."

[features]
default = []
gui-fallback = []

[dependencies]
thiserror = "2.0.12"
which = "7.0.3"

[target.'cfg(target_os = "windows")'.dependencies]
arboard = { version = "3.6.1", default-features = false }
windows = { version = "0.61.1", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2.0"
arboard = { version = "3.6.1", default-features = false }
core-foundation = "0.10.0"
core-graphics = "0.24.0"
mac-notification-sys = "0.6.15"
macos-accessibility-client = "0.0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
async-io = "2.5.0"
atspi = "0.30.0"
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"] }
notify-rust = { version = "4.11.7", default-features = false, features = ["z"] }

[lints]
workspace = true
